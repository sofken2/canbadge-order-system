<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>スタッフ画面（準備中）</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #e8f1ff; color: #333; }
  main { text-align: center; padding: 24px; }
  .badge { width: 160px; height: 160px; margin: 0 auto 24px; border-radius: 50%; background: #3a86ff; display: grid; place-items: center; font-size: 56px; box-shadow: 0 6px 0 #2563c9; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { margin: 4px 0; }
  code { background: #0001; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <div class="badge">🧑‍🔧</div>
  <h1>スタッフ画面（準備中）</h1>
  <p>スタッフ向けのダミーページです。</p>
  <p>Caddy からの配信: <strong>OK</strong></p>
  <p>API: <code id="api">確認中…</code></p>
</main>
<script>
  fetch("/api/status")
    .then((r) => r.json())
    .then((j) => { document.getElementById("api").textContent = "OK (" + j.status + ")"; })
    .catch(() => { document.getElementById("api").textContent = "届きません"; });
</script>
</body>
</html>
